# Runs the prebuilt multi-arch image from the GitHub Container Registry.
# Meant to be pasted into Portainer (Stacks > Add stack > Web editor):
# nothing is built on your NAS, the image is only pulled.
#
# Set CFZT_IMAGE under "Environment variables" and deploy. Everything else —
# Cloudflare token, account ID, password — is configured in the web UI the
# first time you open it.

services:
  cfzerotrustcontrol:
    image: ${CFZT_IMAGE:?set CFZT_IMAGE, for example ghcr.io/yourname/cfzerotrustcontrol:latest}
    container_name: cfzerotrustcontrol
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${CFZT_PORT:-8099}:8080"
    environment:
      # All optional: leave them empty and use the web UI instead.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      CFZT_PASSWORD: ${CFZT_PASSWORD:-}
      CFZT_SECRET_KEY: ${CFZT_SECRET_KEY:-}
    volumes:
      - cfzt-data:/data

volumes:
  cfzt-data:
