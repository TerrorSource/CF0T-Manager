# Draait de kant-en-klare multi-arch image van GitHub Container Registry.
# Bedoeld om in Portainer te plakken (Stacks > Add stack > Web editor):
# er wordt niets gebouwd op je NAS, alleen gepulld.
#
# Zet in Portainer onder "Environment variables" minimaal:
#   CFZT_IMAGE      ghcr.io/<jouw-github-naam>/<repo-naam>:latest
#   CF_API_TOKEN    <je Cloudflare API-token>
#   CF_ACCOUNT_ID   <je Cloudflare account-ID>
#   CFZT_PASSWORD   <wachtwoord voor de web-UI>
#   CFZT_SECRET_KEY <openssl rand -hex 32>

services:
  cfzerotrustcontrol:
    image: ${CFZT_IMAGE:?zet CFZT_IMAGE, bijvoorbeeld ghcr.io/jouwnaam/cfzerotrustcontrol:latest}
    container_name: cfzerotrustcontrol
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${CFZT_PORT:-8099}:8080"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN ontbreekt}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?CF_ACCOUNT_ID ontbreekt}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      CFZT_PASSWORD: ${CFZT_PASSWORD:-}
      CFZT_SECRET_KEY: ${CFZT_SECRET_KEY:-}
      CFZT_SESSION_HOURS: ${CFZT_SESSION_HOURS:-12}
      CFZT_SECURE_COOKIE: ${CFZT_SECURE_COOKIE:-0}
      CFZT_DEFAULT_ORIGIN_HOST: ${CFZT_DEFAULT_ORIGIN_HOST:-192.168.1.9}
    volumes:
      - cfzt-data:/data

volumes:
  cfzt-data:
