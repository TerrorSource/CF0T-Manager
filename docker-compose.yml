# Bouwt de image uit deze map. Gebruik deze file lokaal en voor een
# Portainer-stack van type "Repository".
# Wil je in Portainer de kant-en-klare image van GHCR trekken in plaats van
# bouwen op je NAS? Gebruik dan docker-compose.ghcr.yml.

services:
  cfzerotrustcontrol:
    build: .
    image: ${CFZT_IMAGE:-cfzerotrustcontrol:local}
    container_name: cfzerotrustcontrol
    restart: unless-stopped
    ports:
      - "${CFZT_PORT:-8099}:8080"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN ontbreekt - zet hem in .env of in de Portainer stack-variabelen}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?CF_ACCOUNT_ID ontbreekt - zet hem in .env of in de Portainer stack-variabelen}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      CFZT_PASSWORD: ${CFZT_PASSWORD:-}
      CFZT_SECRET_KEY: ${CFZT_SECRET_KEY:-}
      CFZT_SESSION_HOURS: ${CFZT_SESSION_HOURS:-12}
      CFZT_SECURE_COOKIE: ${CFZT_SECURE_COOKIE:-0}
      CFZT_DEFAULT_ORIGIN_HOST: ${CFZT_DEFAULT_ORIGIN_HOST:-192.168.1.9}
    volumes:
      - cfzt-data:/data

volumes:
  cfzt-data:
