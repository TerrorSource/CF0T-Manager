# Builds the image from this directory. Use this file locally and for a
# Portainer stack of type "Repository".
# Want Portainer to pull the prebuilt GHCR image instead of building on your
# NAS? Use docker-compose.ghcr.yml instead.

services:
  cfzerotrustcontrol:
    build: .
    image: ${CFZT_IMAGE:-cfzerotrustcontrol:local}
    container_name: cfzerotrustcontrol
    restart: unless-stopped
    ports:
      - "${CFZT_PORT:-8099}:8080"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN:?CF_API_TOKEN is missing - set it in .env or in the Portainer stack variables}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?CF_ACCOUNT_ID is missing - set it in .env or in the Portainer stack variables}
      CF_TUNNEL_ID: ${CF_TUNNEL_ID:-}
      CFZT_PASSWORD: ${CFZT_PASSWORD:-}
      CFZT_SECRET_KEY: ${CFZT_SECRET_KEY:-}
      CFZT_SESSION_HOURS: ${CFZT_SESSION_HOURS:-12}
      CFZT_SECURE_COOKIE: ${CFZT_SECURE_COOKIE:-0}
      CFZT_DEFAULT_ORIGIN_HOST: ${CFZT_DEFAULT_ORIGIN_HOST:-192.168.1.9}
    volumes:
      - cfzt-data:/data

volumes:
  cfzt-data:
