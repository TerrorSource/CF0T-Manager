{% extends "base.html" %}
{% block content %}
<h1>Delete: {{ row.hostname }}{{ row.path }}</h1>
<p class="sub">Pick what should go. Nothing is removed unless you tick it.</p>

<div class="panel">
  <div class="panel-body">
    <form method="post" action="/delete">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="hostname" value="{{ row.hostname }}">
      <input type="hidden" name="path" value="{{ row.path }}">

      <div class="check">
        <input type="checkbox" id="del_route" name="del_route" value="1" {% if row.has_route %}checked{% endif %} {% if not row.has_route %}disabled{% endif %}>
        <label for="del_route">Tunnel route
          {% if row.has_route %}<span class="hint mono">{{ row.service }}</span>{% else %}<span class="hint">(doesn't exist)</span>{% endif %}
        </label>
      </div>
      <div class="check">
        <input type="checkbox" id="del_app" name="del_app" value="1" {% if row.has_app %}checked{% endif %} {% if not row.has_app %}disabled{% endif %}>
        <label for="del_app">Access application
          {% if row.has_app %}<span class="hint">{{ row.app_name }}</span>{% else %}<span class="hint">(doesn't exist)</span>{% endif %}
        </label>
      </div>
      {% if dns_records %}
      {% for record in dns_records %}
      <div class="check">
        <input type="checkbox" id="dns_{{ loop.index }}" name="del_dns_ids" value="{{ record.id }}"
               {% if record.content.endswith('.cfargotunnel.com') %}checked{% endif %}>
        <label for="dns_{{ loop.index }}">DNS record
          <span class="hint mono">{{ record.type }} → {{ record.content }}</span>
          {% if not record.content.endswith('.cfargotunnel.com') %}
          <span class="badge warn">does not point at the tunnel</span>
          {% endif %}
        </label>
      </div>
      {% endfor %}
      {% else %}
      <div class="check">
        <input type="checkbox" disabled>
        <label>DNS record <span class="hint">(no record found)</span></label>
      </div>
      {% endif %}

      <div class="form-actions">
        <button class="btn danger" type="submit">Delete permanently</button>
        <a class="btn" href="/">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
